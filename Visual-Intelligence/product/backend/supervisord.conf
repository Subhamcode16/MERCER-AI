[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3

; ── FastAPI API server ────────────────────────────────────────────────────────
[program:api]
command=uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
directory=/app
autostart=true
autorestart=true
startretries=3
stderr_logfile=/var/log/supervisor/api.err.log
stdout_logfile=/var/log/supervisor/api.out.log
; Least-privilege: run as non-root user (matches Dockerfile)
user=atelier
environment=PYTHONUNBUFFERED="1"

; ── Batch Worker ─────────────────────────────────────────────────────────────
; Runs alongside API — polls MongoDB every 15-30 min for non-urgent jobs
[program:batch_worker]
command=python workers/batch_worker.py
directory=/app
autostart=true
autorestart=true
startretries=3
stderr_logfile=/var/log/supervisor/batch_worker.err.log
stdout_logfile=/var/log/supervisor/batch_worker.out.log
user=atelier
environment=PYTHONUNBUFFERED="1"
